name = "star-cyber-ai-x"
pages_build_output_dir = "./web"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages reads secrets from its own environment settings.
# Core owner/API secrets may include STAR_API_TOKEN and GitHub App credentials.
#
# Claude-through-Cloudflare:
#   Secret: ANTHROPIC_API_KEY
#   Secret: STAR_CLAUDE_PROXY_TOKEN (32+ chars; this goes in InferrLM's API Key field)
#   Variable: STAR_ANTHROPIC_MODEL (default: claude-sonnet-4-6)
#   Variable: STAR_AI_PROVIDER=anthropic to make STAR POWER mode use Claude
#
# Workers AI:
#   Variable: STAR_AI_PROVIDER=cloudflare
#   Variable: STAR_WORKERS_AI_MODEL (default: @cf/qwen/qwen3.8-27b)
#
# Other optional providers remain supported (OpenAI, OpenRouter, self-hosted).

[ai]
binding = "AI"
