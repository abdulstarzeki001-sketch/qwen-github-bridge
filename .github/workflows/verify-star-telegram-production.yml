name: Verify STAR Telegram Production Configuration

on:
  workflow_run:
    workflows: ["Deploy STAR CORE V2 to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Check deployed Telegram API without credentials
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Pages function without Telegram secret header
        shell: bash
        run: |
          set -euo pipefail
          url='https://star-cyber-ai-x.pages.dev/api/telegram/webhook'
          status=''
          for attempt in 1 2 3 4; do
            status=$(curl --silent --show-error --connect-timeout 7 --max-time 15               -o /dev/null -w '%{http_code}' -X POST               -H 'Content-Type: application/json' --data '{}' "$url") || status='000'
            case "$status" in
              401) break;;
              503|403|404|000) sleep 8;;
              *) break;;
            esac
          done
          case "$status" in
            401) echo 'PASS: Telegram webhook is reachable and rejects an unauthenticated request.';;
            503) echo 'BLOCKED: Telegram Production secrets are missing/invalid. Check Cloudflare Variables and Secrets, then redeploy.';exit 1;;
            403) echo 'BLOCKED: Cloudflare Access or WAF disallows Telegram webhook traffic. Keep the secret check but allow requests to this path.';exit 1;;
            404) echo 'BLOCKED: Telegram webhook Function is not deployed at the expected route.';exit 1;;
            000) echo 'BLOCKED: Cannot reach STAR Telegram Function over HTTPS.';exit 1;;
            *) echo "Unexpected webhook status: $status";exit 1;;
          esac
      - name: Automatically register Telegram webhook using signed GitHub deployment identity
        shell: bash
        run: |
          set -euo pipefail
          # GitHub provides this short-lived JWT only inside an authorized Actions job.
          # Neither Telegram secret nor BotFather token is present in GitHub Actions.
          json=$(curl -fsS --connect-timeout 7 --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=star-nexus-telegram-webhook")
          id_token=$(printf '%s' "$json" | node -e '
            let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const v=JSON.parse(s).value;
              if(typeof v!=="string"||v.length<100)process.exit(1);
              process.stdout.write(v)
            })')
          unset json
          code=$(curl --silent --show-error --connect-timeout 7 --max-time 30 \
            -o /tmp/star-telegram-bootstrap.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            -H 'Content-Type: application/json' \
            --data '{"action":"connect"}' \
            'https://star-cyber-ai-x.pages.dev/api/telegram/bootstrap')
          unset id_token
          if [ "$code" != '200' ]; then
            echo "Automatic Telegram webhook activation did not complete (Cloudflare HTTP $code)."
            echo "BotFather identity, Cloudflare Production secrets, and GitHub workflow OIDC must be valid."
            exit 1
          fi
          node -e '
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync("/tmp/star-telegram-bootstrap.json","utf8"));
          if(x.ok!==true||x.connected!==true||x.bot_username!=="@Aistar0017616bot")process.exit(1);
          console.log("SUCCESS: @Aistar0017616bot webhook registered to STAR NEXUS using Cloudflare-stored secrets.");
          console.log("This confirms webhook configuration, not end-to-end model inference.");
          '
      - name: Probe public STAR AI provider readiness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 7 --max-time 15             'https://star-cyber-ai-x.pages.dev/api/health' -o /tmp/star-public-health.json
          node -e '
          const fs=require("node:fs");
          const d=JSON.parse(fs.readFileSync("/tmp/star-public-health.json","utf8"));
          if(d.ok!==true||typeof d.ai_provider!=="string")process.exit(1);
          console.log(JSON.stringify({provider:d.ai_provider,ai_gateway_configured:Boolean(d.ai_gateway),
            note:"AI gateway configuration is not proof of a successful model completion."}));
          '
