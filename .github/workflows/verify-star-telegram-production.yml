name: Verify STAR Telegram Production Configuration

on:
  workflow_run:
    workflows: ["Deploy STAR CORE V2 to Cloudflare Pages"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-star-telegram-production.yml"
      - "functions/_telegram_github_oidc.js"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Check deployed Telegram API without credentials
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Pages function without Telegram secret header
        shell: bash
        run: |
          set -euo pipefail
          url='https://star-cyber-ai-x.pages.dev/api/telegram/webhook'
          status=''
          for attempt in 1 2 3 4; do
            status=$(curl --silent --show-error --connect-timeout 7 --max-time 15               -o /dev/null -w '%{http_code}' -X POST               -H 'Content-Type: application/json' --data '{}' "$url") || status='000'
            case "$status" in
              401) break;;
              503|403|404|000) sleep 8;;
              *) break;;
            esac
          done
          case "$status" in
            401) echo 'PASS: Telegram webhook is reachable and rejects an unauthenticated request.';;
            503) echo 'BLOCKED: Telegram Production secrets are missing/invalid. Check Cloudflare Variables and Secrets, then redeploy.';exit 1;;
            403) echo 'BLOCKED: Cloudflare Access or WAF disallows Telegram webhook traffic. Keep the secret check but allow requests to this path.';exit 1;;
            404) echo 'BLOCKED: Telegram webhook Function is not deployed at the expected route.';exit 1;;
            000) echo 'BLOCKED: Cannot reach STAR Telegram Function over HTTPS.';exit 1;;
            *) echo "Unexpected webhook status: $status";exit 1;;
          esac
      - name: Automatically register Telegram webhook using signed GitHub deployment identity
        shell: bash
        run: |
          set -euo pipefail
          # GitHub provides this short-lived JWT only inside an authorized Actions job.
          # Neither Telegram secret nor BotFather token is present in GitHub Actions.
          json=$(curl -fsS --connect-timeout 7 --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=star-nexus-telegram-webhook")
          id_token=$(printf '%s' "$json" | node -e '
            let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const v=JSON.parse(s).value;
              if(typeof v!=="string"||v.length<100)process.exit(1);
              process.stdout.write(v)
            })')
          unset json
          STAR_DIAG_TOKEN="$id_token" node -e '
          const t=process.env.STAR_DIAG_TOKEN||"";
          const [h,p]=t.split(".");
          const header=JSON.parse(Buffer.from(h,"base64url").toString());
          const c=JSON.parse(Buffer.from(p,"base64url").toString());
          const repo="abdulstarzeki001-sketch/qwen-github-bridge";
          const now=Math.floor(Date.now()/1000);
          console.log("OIDC allowlist diagnostics (booleans only):",JSON.stringify({
            algorithm:header.alg==="RS256",
            issuer:c.iss==="https://token.actions.githubusercontent.com",
            audience:c.aud==="star-nexus-telegram-webhook",
            repository:c.repository===repo,
            branch:c.ref==="refs/heads/main",
            workflow:c.workflow_ref===repo+"/.github/workflows/verify-star-telegram-production.yml@refs/heads/main",
            sub:[
              "repo:"+repo+":ref:refs/heads/main",
              "repo:abdulstarzeki001-sketch@311850512/qwen-github-bridge@1412897704:ref:refs/heads/main"
            ].includes(c.sub),
            repo_ids:String(c.repository_id)==="1412897704"&&String(c.repository_owner_id)==="311850512",
            event:["workflow_run","workflow_dispatch","push"].includes(c.event_name),
            time:typeof c.exp==="number"&&c.exp>now
              &&typeof c.iat==="number"&&c.iat>=now-900
              &&typeof c.nbf==="number"&&c.nbf<=now+60
          }));
          '
          code=$(curl --silent --show-error --connect-timeout 7 --max-time 30 \
            -o /tmp/star-telegram-bootstrap.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            -H 'Content-Type: application/json' \
            --data '{"action":"connect"}' \
            'https://star-cyber-ai-x.pages.dev/api/telegram/bootstrap')
          unset id_token
          if [ "$code" != '200' ]; then
            echo "Automatic Telegram webhook activation did not complete (Cloudflare HTTP $code)."
            echo "BotFather identity, Cloudflare Production secrets, and GitHub workflow OIDC must be valid."
            node -e '
              const fs=require("node:fs");const d=JSON.parse(fs.readFileSync("/tmp/star-telegram-bootstrap.json","utf8"));
              const message=typeof d.error==="string"?d.error:"No JSON error provided";
              console.log("STAR bootstrap response:",message.slice(0,180));
            ' || true
            exit 1
          fi
          node -e '
          const fs=require("node:fs");
          const x=JSON.parse(fs.readFileSync("/tmp/star-telegram-bootstrap.json","utf8"));
          if(x.ok!==true||x.connected!==true||x.bot_username!=="@Aistar0017616bot")process.exit(1);
          console.log("SUCCESS: @Aistar0017616bot webhook registered to STAR NEXUS using Cloudflare-stored secrets.");
          console.log("This confirms webhook configuration, not end-to-end model inference.");
          '
      - name: Probe actual Workers AI completion through signed deployment identity
        shell: bash
        run: |
          set -euo pipefail
          json=$(curl -fsS --connect-timeout 7 --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=star-nexus-telegram-webhook")
          id_token=$(printf '%s' "$json" | node -e '
            let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{
              const v=JSON.parse(s).value;
              if(typeof v!=="string"||v.length<100)process.exit(1);
              process.stdout.write(v)
            })')
          unset json
          code=$(curl --silent --show-error --connect-timeout 8 --max-time 50 \
            -o /tmp/star-model-inference.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            -H 'Content-Type: application/json' \
            --data '{"action":"probe-ai"}' \
            'https://star-cyber-ai-x.pages.dev/api/telegram/bootstrap')
          unset id_token
          STAR_STATUS="$code" node -e '
            const fs=require("node:fs");
            const d=JSON.parse(fs.readFileSync("/tmp/star-model-inference.json","utf8"));
            const ready=process.env.STAR_STATUS==="200"&&d.ok===true&&d.responded===true;
            console.log("STAR inference:",JSON.stringify({
              working:ready,
              provider:typeof d.provider==="string"?d.provider:"unknown",
              model:typeof d.model==="string"?d.model:"unknown",
              error:!ready?(typeof d.reason==="string"?d.reason:"Unavailable"):null
            }));
            if(!ready)process.exit(1);
          '
      - name: Inspect AI status if public, without weakening owner access
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --connect-timeout 7 --max-time 15 \
            -o /tmp/star-public-health.json -w '%{http_code}' \
            'https://star-cyber-ai-x.pages.dev/api/health')
          if [ "$code" = 200 ]; then
            node -e '
              const fs=require("node:fs");const d=JSON.parse(fs.readFileSync("/tmp/star-public-health.json","utf8"));
              if(d.ok!==true||typeof d.ai_provider!=="string")process.exit(1);
              console.log(JSON.stringify({provider:d.ai_provider,ai_gateway_configured:Boolean(d.ai_gateway)}));
            '
          elif [ "$code" = 302 ] || [ "$code" = 403 ]; then
            echo 'STAR AI status remains protected by Cloudflare Access. Telegram webhook registration is independent.'
          else
            echo "STAR AI provider status probe not available (HTTP $code); this does not affect Telegram webhook registration."
          fi
