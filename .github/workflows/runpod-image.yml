name: Build STAR RunPod GPU Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/independent-ai/runpod/**"
      - "deploy/independent-ai/gateway.mjs"
      - ".github/workflows/runpod-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push RunPod image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push GPU inference container
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/independent-ai
          file: ./deploy/independent-ai/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/star-independent-ai:latest
            ghcr.io/${{ github.repository_owner }}/star-independent-ai:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Owner-authenticated STAR Independent Brain using Ollama and Node gateway
          cache-from: type=gha,scope=runpod
          cache-to: type=gha,mode=max,scope=runpod
      - name: Published image
        run: |
          echo 'Image built and pushed to ghcr.io/${{ github.repository_owner }}/star-independent-ai:latest'
          echo 'RunPod will only be created after the owner connects the RunPod account and enables billing.'
