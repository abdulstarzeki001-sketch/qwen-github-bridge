name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python API
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q app tests

      - name: Smoke import
        env:
          DATABASE_PATH: ${{ runner.temp }}/starcyber.db
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
          STAR_API_TOKEN: ci-test-token
        run: |
          python - <<'PY'
          from app.db import init_db
          from app.main import app
          init_db()
          assert app.title == "STAR CYBER AI X"
          assert app.version == "0.7.1"
          print(app.title, app.version)
          PY

  burp-extension:
    name: Burp extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build JAR
        run: mvn -B -f burp-extension/pom.xml clean package

      - name: Upload Burp JAR
        uses: actions/upload-artifact@v4
        with:
          name: star-burp-ai
          path: burp-extension/target/star-burp-ai-0.2.0.jar
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --pull -t star-cyber-ai-x:ci .


  netlify:
    name: Netlify functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Netlify runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Check Netlify functions
        run: npm run check:netlify

      - name: Check web inline JavaScript
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import vm from "node:vm";
          for (const filename of ["web/index.html", "web/ai.html"]) {
            const html = fs.readFileSync(filename, "utf8");
            const scripts = html.split("<script>").slice(1).map(s => s.split("</script>")[0]);
            if (!scripts.length) throw new Error("No inline script found in " + filename);
            for (const source of scripts) new vm.Script(source, {filename});
            console.log(filename + " inline JavaScript syntax valid");
          }
          NODE
