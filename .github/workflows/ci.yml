name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q

      - name: Compile
        run: python -m compileall -q app tests

      - name: Smoke import
        env:
          DATABASE_PATH: ${{ runner.temp }}/starcyber.db
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
          STAR_API_TOKEN: ci-test-token
        run: |
          python - <<'PY'
          from app.db import init_db
          from app.main import app
          init_db()
          assert app.title == "STAR CYBER AI X"
          print(app.title, app.version)
          PY

  burp-extension:
    name: Burp extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          cache-provider: basic

      - name: Build JAR
        run: gradle -p burp-extension clean jar

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --pull -t star-cyber-ai-x:ci .
