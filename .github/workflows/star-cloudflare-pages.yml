name: Deploy STAR CORE V2 to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'functions/**'
      - 'wrangler.toml'
      - '.github/workflows/star-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: star-core-v2-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'd2680f7c5ff39f8d9177a51dbf7fec75' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate iPhone and PWA neural-orb icons
        run: node scripts/generate-star-icons.mjs

      - name: Validate STAR V2 static assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html = fs.readFileSync('web/ai-v2.html','utf8');
          const inline = html.split('<script>').slice(1).map(v=>v.split('</script>')[0]);
          for(const code of inline) new vm.Script(code);
          for(const file of ['star-core-v2-phase2.js','star-core-v2-scene.js','star-core-v2-phase3.js']){
            const source=fs.readFileSync('web/'+file,'utf8');
            new vm.Script(source);
            if(!html.includes(file)) throw new Error('Missing asset reference: '+file);
          }
          for(const file of ['star-core-v2-phase2.css','star-core-v2-phase3.css']){
            if(!fs.existsSync('web/'+file) || !html.includes(file)) throw new Error('Missing stylesheet: '+file);
          }
          for(const file of ['manifest.webmanifest','apple-touch-icon.png','icon-192.png','icon-512.png']){
            if(!fs.existsSync('web/'+file)) throw new Error('Missing iOS/PWA asset: '+file);
          }
          for(const page of ['index.html','ai.html','ai-v2.html']){
            const text=fs.readFileSync('web/'+page,'utf8');
            if(!text.includes('rel="apple-touch-icon"') || !text.includes('manifest.webmanifest'))
              throw new Error('Missing iPhone icon metadata in '+page);
          }
          for(const id of ['p3Objective','p3LocalPlan','p3AiPlan','p3Steps','p3Voice','p3Scan']){
            if(!html.includes('id="'+id+'"')) throw new Error('Missing Commander element: '+id);
          }
          NODE

      - name: Detect deploy credentials
        id: access
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_PAGES_TOKEN or CLOUDFLARE_API_TOKEN secret. Pages deployment skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Cloudflare account and Pages project
        if: steps.access.outputs.enabled == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const candidates=[...new Set([process.env.CLOUDFLARE_ACCOUNT_ID,'d45cb55f3d7654fc0eee90ca0e844378'].filter(Boolean))];
          for(const id of candidates){
            try{
              const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+id+'/pages/projects/star-cyber-ai-x',{
                headers:{Authorization:'Bearer '+token,Accept:'application/json'},
                signal:AbortSignal.timeout(15000)
              });
              const payload=await response.json().catch(()=>null);
              if(response.ok && payload?.success && payload.result?.name==='star-cyber-ai-x'){
                fs.appendFileSync(process.env.GITHUB_ENV,'CLOUDFLARE_ACCOUNT_ID='+id+'\n');
                console.log('Verified Cloudflare Pages project star-cyber-ai-x in account '+id);
                process.exit(0);
              }
              console.log('Pages project not accessible in account '+id+' (HTTP '+response.status+', code '+(payload?.errors?.[0]?.code??'unknown')+')');
            }catch(e){console.log('Cloudflare project lookup failed for account '+id+': '+e.message);}
          }
          console.error('No authorized Cloudflare account exposes the existing star-cyber-ai-x project. Create a Pages Edit token scoped to the account owning this project, then update CLOUDFLARE_PAGES_TOKEN.');
          process.exit(1);
          NODE

      - name: Deploy to star-cyber-ai-x Pages
        if: steps.access.outputs.enabled == 'true'
        run: npx --yes wrangler@4 pages deploy web --project-name=star-cyber-ai-x --branch=main
