name: STAR GitHub Brain

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Security/code-review task for STAR"
        required: false
        default: "Review this repository defensively. Prioritize authentication, authorization, secrets, API security, configuration, and supply-chain risks."

permissions:
  contents: read
  models: read

jobs:
  analyze:
    name: AI Repository Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODELS_MODEL: openai/gpt-4.1
      STAR_BRAIN_PROMPT: ${{ inputs.prompt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run STAR GitHub-native AI brain
        run: python scripts/github_models_brain.py

      - name: Add report to workflow summary
        run: cat star-github-brain-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-github-brain-report
          path: star-github-brain-report.md
          if-no-files-found: error
