# STAR independent model on a private rented GPU or owned NVIDIA server.
# No inference ports are published to the host or the public Internet.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    networks:
      - star-private
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    image: node:24-alpine
    user: node
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["node", "/app/gateway.mjs"]
    environment:
      PORT: "8080"
      STAR_BACKEND_TOKEN: ${STAR_BACKEND_TOKEN:?Set STAR_BACKEND_TOKEN in .env}
      STAR_MODEL: ${STAR_MODEL:-gpt-oss:20b}
      STAR_ALLOWED_MODELS: ${STAR_ALLOWED_MODELS:-gpt-oss:20b}
      OLLAMA_ENDPOINT: "http://ollama:11434/v1/chat/completions"
    volumes:
      - ./gateway.mjs:/app/gateway.mjs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    networks:
      - star-private
    depends_on:
      - ollama

  # Optional interactive WormGPTv2 coding agent; not started by "docker compose up -d".
  # Launch with: docker compose --profile agent run --rm agent
  # This service has no Cloudflare, GitHub, or production app credentials.
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    stdin_open: true
    tty: true
    init: true
    user: node
    working_dir: /workspace
    environment:
      CLAUDE_CODE_USE_OPENAI: "1"
      OPENAI_BASE_URL: "http://ollama:11434/v1"
      OPENAI_MODEL: ${STAR_AGENT_MODEL:-qwen2.5-coder:7b}
      HOME: "/home/node"
    volumes:
      - ./agent-workspace:/workspace
      - agent-home:/home/node
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - star-private
    depends_on:
      - ollama

  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    networks:
      - star-private
    depends_on:
      - gateway

networks:
  star-private:
    driver: bridge

volumes:
  ollama-models:
  agent-home:
