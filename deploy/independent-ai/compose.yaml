# STAR independent model on a private rented GPU or owned NVIDIA server.
# No inference ports are published to the host or the public Internet.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    networks:
      - star-private
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    image: node:24-alpine
    user: node
    restart: unless-stopped
    init: true
    working_dir: /app
    command: ["node", "/app/gateway.mjs"]
    environment:
      PORT: "8080"
      STAR_BACKEND_TOKEN: ${STAR_BACKEND_TOKEN:?Set STAR_BACKEND_TOKEN in .env}
      STAR_MODEL: ${STAR_MODEL:-gpt-oss:20b}
      OLLAMA_ENDPOINT: "http://ollama:11434/v1/chat/completions"
    volumes:
      - ./gateway.mjs:/app/gateway.mjs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    networks:
      - star-private
    depends_on:
      - ollama

  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env}
    restart: unless-stopped
    networks:
      - star-private
    depends_on:
      - gateway

networks:
  star-private:
    driver: bridge

volumes:
  ollama-models:
